<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruise Finder</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(to bottom, #071c2c, #f4f7fb);
  }

  #shipModalContent::-webkit-scrollbar {
    width: 8px;
  }
  #shipModalContent::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.3);
    border-radius: 8px;
  }
</style>
</head>

<body class="min-h-screen">

<!-- HERO -->
<section class="relative h-[380px] w-full overflow-hidden">
  <img
    src="https://images.unsplash.com/photo-1502920514313-52581002a659?auto=format&fit=crop&w=2000&q=80"
    class="absolute inset-0 w-full h-full object-cover"
  />
  <div class="absolute inset-0 bg-black/60"></div>

  <div class="relative z-10 h-full flex flex-col justify-center px-10 text-white">
    <h1 class="text-5xl font-bold">Cruise Finder</h1>
    <p class="text-gray-200 mt-3 max-w-xl">
      Discover ships tailored to your perfect voyage.
    </p>
  </div>
</section>

<!-- FILTERS -->
<section class="max-w-5xl mx-auto -mt-14 px-4">
  <div class="bg-white/80 backdrop-blur-xl shadow-2xl rounded-3xl p-6 border border-white/30">

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">

      <div>
        <label class="font-bold text-sm">Budget</label>
        <select id="budget" class="w-full mt-2 p-2 border rounded-xl">
          <option>Budget</option>
          <option>Mid</option>
          <option>Luxury</option>
        </select>
      </div>

      <div>
        <label class="font-bold text-sm">Ship Size</label>
        <select id="size" class="w-full mt-2 p-2 border rounded-xl">
          <option>Small</option>
          <option>Medium</option>
          <option>Large</option>
          <option>Mega</option>
        </select>
      </div>

      <div>
        <label class="font-bold text-sm">Vibes</label>
        <select id="vibes" multiple size="4" class="w-full mt-2 p-2 border rounded-xl">
          <option>Family</option>
          <option>Adventure</option>
          <option>Relaxation</option>
          <option>Party</option>
        </select>
      </div>

      <div>
        <label class="font-bold text-sm">Amenities</label>
        <select id="amenities" multiple size="6" class="w-full mt-2 p-2 border rounded-xl">
          <option>Pools</option>
          <option>Spa</option>
          <option>Shows</option>
          <option>Bars</option>
          <option>Adventure Park</option>
          <option>Kids Club</option>
        </select>
      </div>

    </div>

    <div class="text-center mt-6">
      <button onclick="calculateScores()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-bold shadow-lg transition">
        Find My Perfect Ship
      </button>
    </div>

  </div>
</section>

<!-- RESULTS -->
<section id="results"
  class="max-w-6xl mx-auto px-4 mt-12 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
</section>

<!-- MODAL -->
<div id="shipModal"
  class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 opacity-0 pointer-events-none transition">

  <div id="shipModalContent"
    class="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl transform translate-y-10 transition">

    <button onclick="closeModal()"
      class="absolute top-4 right-5 text-2xl font-bold text-gray-600 hover:text-black">
      &times;
    </button>

    <div id="modalContent"></div>

  </div>
</div>

<script src="ship_matcher.js"></script>
</body>
</html>
