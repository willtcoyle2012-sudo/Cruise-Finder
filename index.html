<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruise Finder</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Montserrat',sans-serif;
  background:#f3f7fb;
  color:#1e293b;
}

.option-btn{
  padding:10px 18px;
  border-radius:999px;
  background:white;
  border:1px solid #dbe4ee;
  transition:0.2s ease;
  cursor:pointer;
  font-size:14px;
  font-weight:500;
}

.option-btn:hover{
  background:#eff6ff;
}

.option-btn.active{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}

.ship-card{
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,0.06);
  transition:0.25s ease;
}

.ship-card:hover{
  transform:translateY(-4px);
}

</style>
</head>

<body>

<!-- TOP SECTION -->

<section class="max-w-6xl mx-auto px-6 pt-10">

  <div class="bg-white rounded-[32px] shadow-xl border border-gray-200 p-8">

    <div class="flex flex-col lg:flex-row items-center justify-between gap-10">

      <div class="max-w-2xl">

        <h1 class="text-5xl md:text-6xl font-bold tracking-tight">
          Cruise Finder
        </h1>

        <p class="mt-5 text-lg text-gray-600">
          Discover cruise ships in a more interactive way.
        </p>

      </div>

      <div class="w-full lg:w-[420px] h-[220px] rounded-3xl overflow-hidden shadow-lg">

        <img
          src="https://images.unsplash.com/photo-1569263979104-865ab7cd8d13?auto=format&fit=crop&w=1200&q=80"
          class="w-full h-full object-cover"
        >

      </div>

    </div>

  </div>

</section>

<!-- FILTERS -->

<section class="max-w-6xl mx-auto px-6 mt-8">

  <div class="bg-white rounded-[32px] shadow-lg border border-gray-200 p-8">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

      <!-- BUDGET -->

      <div>

        <label class="font-bold text-sm">
          Budget
        </label>

        <select id="budget"
          class="w-full mt-3 p-3 rounded-2xl border border-gray-200 bg-gray-50">

          <option value="Budget">Budget</option>
          <option value="Mid">Mid</option>
          <option value="Luxury">Luxury</option>

        </select>

      </div>

      <!-- SIZE -->

      <div>

        <label class="font-bold text-sm">
          Ship Size
        </label>

        <select id="size"
          class="w-full mt-3 p-3 rounded-2xl border border-gray-200 bg-gray-50">

          <option value="Small">Small</option>
          <option value="Medium">Medium</option>
          <option value="Large">Large</option>
          <option value="Mega">Mega</option>

        </select>

      </div>

    </div>

    <!-- ATMOSPHERE -->

    <div class="mt-8">

      <label class="font-bold text-sm">
        Atmosphere
      </label>

      <div id="atmosphere" class="flex flex-wrap gap-3 mt-4">

        <button class="option-btn" data-value="Family">
          Family
        </button>

        <button class="option-btn" data-value="Adventure">
          Adventure
        </button>

        <button class="option-btn" data-value="Relaxation">
          Relaxation
        </button>

        <button class="option-btn" data-value="Party">
          Party
        </button>

      </div>

    </div>

    <!-- AMENITIES -->

    <div class="mt-8">

      <label class="font-bold text-sm">
        Amenities
      </label>

      <div id="amenities" class="flex flex-wrap gap-3 mt-4">

        <button class="option-btn" data-value="Pools">Pools</button>
        <button class="option-btn" data-value="Spa">Spa</button>
        <button class="option-btn" data-value="Shows">Shows</button>
        <button class="option-btn" data-value="Bars">Bars</button>
        <button class="option-btn" data-value="Adventure Park">Adventure Park</button>
        <button class="option-btn" data-value="Kids Club">Kids Club</button>

      </div>

    </div>

    <!-- BUTTON -->

    <div class="text-center mt-10">

      <button onclick="calculateScores()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-4 rounded-2xl shadow-lg transition">

        Find My Perfect Ship

      </button>

    </div>

  </div>

</section>

<!-- RESULTS -->

<section id="results"
  class="max-w-6xl mx-auto px-6 mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 pb-20">
</section>

<script src="ship_matcher.js"></script>

</body>
</html>
